<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>{{ kp.code }} — Коммерческое предложение Софтмонтаж</title>
<style>
  body { margin: 0; background: #E9EBF2; font-family: Rubik, Arial, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; justify-content: center; padding: 10px; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .bar button, .bar a { font: 600 15px Rubik, Arial, sans-serif; padding: 10px 18px; border-radius: 10px; border: 0; cursor: pointer; text-decoration: none; }
  .bar button { background: #2E3A8C; color: #fff; }
  .bar a { background: #F07F1E; color: #fff; }
  .wrap { padding: 20px 0 40px; overflow-x: auto; }
  iframe { display: block; width: 210mm; height: 297mm; margin: 0 auto; border: 0; background: #fff; box-shadow: 0 4px 24px rgba(20,24,50,.12); }
  @media print { .bar { display: none; } body { background: #fff; } .wrap { padding: 0; } }
</style></head>
<body>
  <div class="bar"><button type="button" onclick="document.getElementById('kp').contentWindow.print()">Скачать PDF / распечатать</button><a href="{{ wa }}" id="wa" target="_blank" rel="noopener">Написать в WhatsApp</a></div>
  <div class="wrap"><iframe id="kp" title="Коммерческое предложение" srcdoc="{{ sheet|force_escape }}" onload="this.style.height=this.contentDocument.documentElement.scrollHeight+'px'"></iframe></div>
</body></html>
