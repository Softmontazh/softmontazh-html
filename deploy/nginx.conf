# softmontazh.kz — конфиг nginx.
# Ставится скриптом deploy/update.sh в /etc/nginx/sites-available/softmontazh.kz
# (старый файл сохраняется рядом как .bak-ДАТА, перед перезагрузкой — nginx -t).
# Сертификат выпускает и продлевает certbot (Let's Encrypt) — строки SSL ниже не менять.

# http → https, www → без www
server {
    listen 80;
    server_name softmontazh.kz www.softmontazh.kz;
    return 301 https://softmontazh.kz$request_uri;
}

# https://www → https://без www
server {
    listen 443 ssl;
    server_name www.softmontazh.kz;

    ssl_certificate /etc/letsencrypt/live/softmontazh.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/softmontazh.kz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://softmontazh.kz$request_uri;
}

# Основной сайт
server {
    listen 443 ssl;
    server_name softmontazh.kz;

    ssl_certificate /etc/letsencrypt/live/softmontazh.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/softmontazh.kz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/softmontazh.kz;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Служебное наружу не отдаём: .git и прочие скрытые, README/скрипты/журналы, папка deploy, VERSION
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(md|sh|log)$ { return 404; }
    location ^~ /deploy/ { return 404; }
    location = /VERSION { return 404; }

    # Задел под бота — не трогать
    location /webhook {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статика: css/js/картинки/шрифты — кэш 30 дней (сброс через ?v=N в ссылках)
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Страницы: всегда свежие; работают и /services, и /services.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
